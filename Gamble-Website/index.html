<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doodle Casino</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=P"
      atrick+Hand&display="swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <div id="allContent">
      <header>
        <div class="logo">Doodle Casino</div>
        <div class="wallet">
          <span class="wallet-icon">💰</span>
          <span class="wallet-amount" id="wallet-display">$1,000</span>
          <button
            class="add-money-btn locked-btn"
            onclick="openModal()"
            title="Win a game to unlock Add Money"
          >
            +
          </button>
        </div>
      </header>

      <!-- ADD MONEY MODAL -->
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
          <div class="modal-body">
            <h2>Add Funds</h2>
            <p id="modal-subtitle">Win your first game to unlock!</p>
            <div class="amount-options">
              <button
                class="amount-btn locked"
                id="amt-0"
                onclick="addMoney(100)"
                disabled
              >
                🔒 $100
              </button>
              <button
                class="amount-btn locked"
                id="amt-1"
                onclick="addMoney(250)"
                disabled
              >
                🔒 $250
              </button>
              <button
                class="amount-btn locked"
                id="amt-2"
                onclick="addMoney(500)"
                disabled
              >
                🔒 $500
              </button>
              <button
                class="amount-btn locked"
                id="amt-3"
                onclick="addMoney(1000)"
                disabled
              >
                🔒 $1,000
              </button>
              <button
                class="amount-btn locked"
                id="amt-4"
                onclick="addMoney(5000)"
                disabled
              >
                🔒 $5,000
              </button>
              <button
                class="amount-btn locked"
                id="amt-5"
                onclick="addMoney(10000)"
                disabled
              >
                🔒 $10,000
              </button>
            </div>
            <button class="modal-close" onclick="closeModal()">Cancel</button>
          </div>
        </div>
      </div>

      <!-- UNLOCK NOTIFICATION -->
      <div class="unlock-notif" id="unlock-notif">
        <div class="unlock-icon" id="unlock-icon">🔓</div>
        <div class="unlock-text" id="unlock-text"></div>
      </div>


      
    </div>
  </body>
</html>
